<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="card shadow p-4 mx-auto mt-5" style="max-width: 400px;">
  <h2 class="text-center mb-4">Iniciar sesión</h2>

  <div class="mb-3">
    <label for="username" class="form-label">
      <i class="bi bi-person-fill me-1"></i> Usuario
    </label>
    <input id="username" class="form-control" formControlName="username" type="text" required placeholder="Tu usuario"/>
    <div class="text-danger mt-1 small" *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
      Usuario requerido
    </div>
  </div>

  <div class="mb-3 position-relative">
    <label for="password" class="form-label">
      <i class="bi bi-lock-fill me-1"></i> Contraseña
    </label>

    <input
      id="password"
      class="form-control"
      [type]="showPassword ? 'text' : 'password'"
      formControlName="password"
      required
      placeholder="Contraseña"
    />

    <button
      type="button"
      class="btn btn-sm btn-outline-secondary position-absolute end-0 top-50 translate-middle-y me-2"
      (click)="togglePassword()"
      tabindex="-1"
    >
      <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
    </button>

    <div class="text-danger mt-1 small" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
      Contraseña requerida
    </div>
  </div>

  <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
    <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
  </button>

  <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>
</form>

<div class="text-center mt-3">
  <p class="mb-1">
    ¿No tienes cuenta?
    <a routerLink="/register" class="text-primary fw-bold">Regístrate</a>
  </p>
  <p>
    ¿Olvidaste tu contraseña?
    <a routerLink="/forgot-password" class="text-primary fw-bold">Recupérala aquí</a>
  </p>
</div>
