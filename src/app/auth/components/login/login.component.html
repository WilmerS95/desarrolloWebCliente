<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="card shadow p-4 mx-auto mt-5" style="max-width: 400px;">
  <h2 class="text-center mb-4">Iniciar sesión</h2>

  <div class="mb-3">
    <label for="email" class="form-label">
      <i class="bi bi-envelope-fill me-1"></i> Correo electrónico
    </label>
    <input id="email" class="form-control" formControlName="email" type="email" required />
    <div class="text-danger mt-1 small" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
      Correo inválido
    </div>
  </div>

  <div class="mb-3">
    <label for="password" class="form-label">
      <i class="bi bi-lock-fill me-1"></i> Contraseña
    </label>
    <input id="password" class="form-control" formControlName="password" type="password" required />
    <div class="text-danger mt-1 small" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
      Contraseña requerida
    </div>
  </div>

  <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
    <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
  </button>

  <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>
</form>

<div class="text-center mt-4">
  <p class="text-muted">O inicia sesión con:</p>
  <button class="btn btn-outline-danger me-2" (click)="loginWithGoogle()">
    <i class="bi bi-google me-1"></i> Google
  </button>
  <button class="btn btn-outline-primary" (click)="loginWithFacebook()">
    <i class="bi bi-facebook me-1"></i> Facebook
  </button>
</div>

<footer class="app-footer">
  <p>© 2025 Empeños Keity. Todos los derechos reservados.</p>
</footer>
