<form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="card shadow p-4 mx-auto mt-5" style="max-width: 400px;">
  <h2 class="text-center mb-4">Crear cuenta</h2>

  <div class="mb-3">
    <label for="name" class="form-label">
      <i class="bi bi-person-fill me-1"></i> Nombre completo
    </label>
    <input id="name" class="form-control" formControlName="name" placeholder="Tu nombre completo" />
    <div class="text-danger mt-1 small" *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched">
      El nombre es requerido
    </div>
  </div>

  <div class="mb-3">
    <label for="email" class="form-label">
      <i class="bi bi-envelope-fill me-1"></i> Correo electrónico
    </label>
    <input id="email" class="form-control" formControlName="email" type="email" placeholder="ejemplo@correo.com" />
    <div class="text-danger mt-1 small" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
      Correo inválido
    </div>
  </div>

  <div class="mb-3">
    <label for="password" class="form-label">
      <i class="bi bi-lock-fill me-1"></i> Contraseña
    </label>
    <input id="password" class="form-control" formControlName="password" type="password" placeholder="Contraseña" />
    <div class="text-danger mt-1 small" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
      Contraseña requerida
    </div>
  </div>

  <button type="submit" class="btn btn-primary w-100" [disabled]="registerForm.invalid">
    <i class="bi bi-person-plus-fill me-1"></i> Registrarse
  </button>
</form>

<div class="text-center mt-3">
  <p>
    ¿Ya tienes cuenta?
    <a routerLink="/login" class="text-primary fw-bold">Inicia sesión</a>
  </p>
</div>
