<form class [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="card shadow p-4 mx-auto mt-5" style="max-width: 500px;">
  <h2 class="text-center mb-4">Crear cuenta</h2>

  <div class="mb-3">
    <label for="username" class="form-label">Usuario <span class="required-star">*</span></label>
    <input id="username" class="form-control" formControlName="username" placeholder="Tu usuario" />
    <div class="text-danger mt-1 small" *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched">
      El usuario es requerido
    </div>
  </div>

  <div class="mb-3">
    <label for="email" class="form-label">Correo electrónico <span class="required-star">*</span></label>
    <input id="email" class="form-control" formControlName="email" type="email" placeholder="ejemplo@correo.com" />
    <div class="text-danger mt-1 small" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
      Correo inválido
    </div>
  </div>

  <div class="mb-3">
    <label for="password" class="form-label">Contraseña <span class="required-star">*</span></label>
    <input id="password" class="form-control" formControlName="password" type="password" placeholder="Contraseña" />
    <div class="text-danger mt-1 small" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
      Contraseña requerida
    </div>
  </div>

  <div class="mb-3">
    <label for="firstName" class="form-label">Primer nombre <span class="required-star">*</span></label>
    <input id="firstName" class="form-control" formControlName="firstName" placeholder="Primer nombre" />
    <div class="text-danger mt-1 small" *ngIf="registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched">
      El primer nombre es requerido
    </div>
  </div>

  <div class="mb-3">
    <label for="secondOrMoreNames" class="form-label">Otros nombres</label>
    <input id="secondOrMoreNames" class="form-control" formControlName="secondOrMoreNames" placeholder="Segundo nombre, etc." />
  </div>

  <div class="mb-3">
    <label for="firstLastName" class="form-label">Primer apellido <span class="required-star">*</span></label>
    <input id="firstLastName" class="form-control" formControlName="firstLastName" placeholder="Primer apellido" />
    <div class="text-danger mt-1 small" *ngIf="registerForm.get('firstLastName')?.invalid && registerForm.get('firstLastName')?.touched">
      El primer apellido es requerido
    </div>
  </div>

  <div class="mb-3">
    <label for="secondLastName" class="form-label">Segundo apellido</label>
    <input id="secondLastName" class="form-control" formControlName="secondLastName" placeholder="Segundo apellido" />
  </div>

  <div class="mb-3">
    <label for="marriedLastName" class="form-label">Apellido de casada</label>
    <input id="marriedLastName" class="form-control" formControlName="marriedLastName" placeholder="Apellido de casada" />
  </div>

  <div class="mb-3">
    <label for="telephone" class="form-label">Teléfono</label>
    <input id="telephone" class="form-control" formControlName="telephone" placeholder="Número de teléfono" />
  </div>

  <div class="mb-3">
    <label for="address" class="form-label">Dirección</label>
    <input id="address" class="form-control" formControlName="address" placeholder="Dirección" />
  </div>

  <button type="submit" class="btn btn-primary w-100" [disabled]="registerForm.invalid">
    Registrarse
  </button>
</form>

<div class="text-center mt-3">
  <p>
    ¿Ya tienes cuenta?
    <a routerLink="/login" class="text-primary fw-bold">Inicia sesión</a>
  </p>
</div>
