<div class="form-container">
  <h2>Solicitud de Préstamo</h2>
  <form>
    <div class="form-group">
      <label for="nombre">Nombre completo:</label>
      <input type="text" id="nombre" placeholder="Ingrese su nombre completo" />
    </div>

    <div class="form-group">
      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" placeholder="Ingrese su correo" />
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" placeholder="Ingrese su número de teléfono" />
    </div>

    <div class="form-group">
      <label for="monto">Monto del préstamo:</label>
      <input type="number" id="monto" placeholder="Ingrese el monto solicitado" />
    </div>

    <div class="form-group">
      <label for="plazo">Plazo (meses):</label>
      <input type="number" id="plazo" placeholder="Ingrese el plazo deseado" />
    </div>

    <div class="form-group">
      <label for="ingresos">Ingresos mensuales:</label>
      <input type="number" id="ingresos" placeholder="Ingrese sus ingresos aproximados" />
    </div>

    <div class="form-group">
      <label for="comentarios">Comentarios adicionales:</label>
      <textarea id="comentarios" placeholder="Opcional"></textarea>
    </div>

    <button type="button">Enviar solicitud</button>
  </form>
</div>
