<h2>Solicitud de Préstamo</h2>
<form (ngSubmit)="enviarSolicitud()">
  <div>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" [(ngModel)]="nombre" name="nombre" />
  </div>

  <div>
    <label for="apellido">Apellido:</label>
    <input type="text" id="apellido" [(ngModel)]="apellido" name="apellido" />
  </div>

  <div>
    <label for="cedula">Cédula:</label>
    <input type="text" id="cedula" [(ngModel)]="cedula" name="cedula" />
  </div>

  <div>
    <label for="monto">Monto del préstamo:</label>
    <input type="number" id="monto" [(ngModel)]="monto" name="monto" />
  </div>

  <div>
    <label for="plazo">Plazo (meses):</label>
    <input type="number" id="plazo" [(ngModel)]="plazo" name="plazo" />
  </div>

  <button type="submit">Enviar solicitud</button>
</form>
