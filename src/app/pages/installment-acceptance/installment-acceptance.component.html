<div class="container mt-5">
  <div class="card">
    <div class="card-header bg-success text-white">
      <h3>¡Tu solicitud ha sido aprobada!</h3>
    </div>
    <div class="card-body">
      <div class="alert alert-info">
        <strong>Revisa el plan de cuotas y acepta para continuar</strong>
      </div>

      <h5>Plan de Pagos:</h5>
      <table class="table table-bordered">
        <thead>
        <tr>
          <th>Cuota #</th>
          <th>Monto</th>
          <th>Fecha de Vencimiento</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let inst of installments">
          <td>{{ inst.installmentNumber }}</td>
          <td>{{ inst.amount | currency:'GTQ' }}</td>
          <td>{{ inst.dueDate | date:'dd/MM/yyyy' }}</td>
        </tr>
        </tbody>
        <tfoot>
        <tr class="table-active">
          <th>TOTAL A PAGAR</th>
          <th colspan="2">{{ totalAmount | currency:'GTQ' }}</th>
        </tr>
        </tfoot>
      </table>

      <div class="text-center mt-4">
        <button class="btn btn-success btn-lg" (click)="acceptPlan()">
          Aceptar Plan de Cuotas
        </button>
        <button class="btn btn-secondary btn-lg ms-2" (click)="goBack()">
          Revisar más tarde
        </button>
      </div>
    </div>
  </div>
</div>
