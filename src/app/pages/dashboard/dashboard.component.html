<div class="container-fluid mt-4">
  <div class="row">
    <div class="col-md-6 mb-4" *ngIf="canViewParameters()">
      <div class="card h-100 shadow-sm">
        <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
          <h5 class="mb-0">
            <i class="bi bi-clock-history"></i> Cambios Recientes en Parámetros
          </h5>
          <button
            class="btn btn-sm btn-light"
            (click)="goToParameters()">
            Ver todos
          </button>
        </div>
        <div class="card-body">
          <div *ngIf="loading" class="text-center py-3">
            <div class="spinner-border spinner-border-sm" role="status"></div>
          </div>

          <div *ngIf="!loading && recentChanges.length === 0" class="text-center py-3 text-muted">
            <i class="bi bi-inbox display-6 d-block mb-2"></i>
            <small>No hay cambios recientes</small>
          </div>

          <div class="list-group" *ngIf="!loading && recentChanges.length > 0">
            <div
              *ngFor="let change of recentChanges"
              class="list-group-item list-group-item-action">
              <div class="d-flex w-100 justify-content-between align-items-start">
                <div>
                  <h6 class="mb-1">
                    <span
                      class="badge me-2"
                      [ngClass]="getActionBadgeClass(change.action)">
                      {{ change.action }}
                    </span>
                    <code class="bg-light px-2 py-1">{{ change.parameterName }}</code>
                  </h6>
                  <p class="mb-1 small">
                    <span *ngIf="change.oldValue" class="text-muted">
                      {{ change.oldValue }}
                    </span>
                    <i class="bi bi-arrow-right mx-2"></i>
                    <strong class="text-primary">{{ change.newValue }}</strong>
                  </p>
                  <small class="text-muted">
                    <i class="bi bi-person"></i> {{ change.changedBy }}
                  </small>
                </div>
                <small class="text-muted">
                  {{ change.changedAt | date:'dd/MM HH:mm' }}
                </small>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
