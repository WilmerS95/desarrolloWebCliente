<div class="container mt-4">
  <h2>Administrar Roles</h2>

  <button class="btn btn-primary mb-3" (click)="startCreate()">Nuevo Rol</button>

  <table class="table table-striped">
    <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Descripción</th>
      <th>Permisos</th>
      <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let role of roles">
      <td>{{ role.roleId }}</td>
      <td>{{ role.roleName }}</td>
      <td>{{ role.description }}</td>
      <td>
        <button class="btn btn-sm btn-info" (click)="togglePermissions(role.roleId)">
          {{ expandedRoleId === role.roleId ? 'Ocultar' : 'Ver' }}
        </button>
        <ul *ngIf="expandedRoleId === role.roleId" class="mt-2">
          <li *ngFor="let perm of role.permissions">{{ perm.permissionName }}</li>
        </ul>
      </td>
      <td>
        <button class="btn btn-sm btn-warning me-2" (click)="startEdit(role)"><i class="bi bi-pencil"></i> Editar</button>
        <button class="btn btn-sm btn-danger" (click)="deleteRole(role.roleId)"><i class="bi bi-trash3"></i> Eliminar</button>
      </td>
    </tr>
    </tbody>
  </table>

  <div *ngIf="showForm" class="card p-3 mt-3">
    <h4>{{ editingRole ? 'Editar Rol' : 'Nuevo Rol' }}</h4>
    <form [formGroup]="roleForm" (ngSubmit)="saveRole()">
      <div class="mb-3">
        <label>Nombre</label>
        <input formControlName="roleName" class="form-control" />
      </div>
      <div class="mb-3">
        <label>Descripción</label>
        <input formControlName="description" class="form-control" />
      </div>

      <div class="mb-3">
        <label>Permisos</label>
        <div *ngFor="let perm of allPermissions" class="form-check">
          <input
            type="checkbox"
            class="form-check-input"
            [checked]="isPermissionSelected(perm.permissionId)"
            (change)="onPermissionChange($event, perm.permissionId)"
          />
          <label class="form-check-label">{{ perm.permissionName }}</label>
        </div>
      </div>

      <button class="btn btn-success" type="submit" [disabled]="roleForm.invalid">Guardar</button>
      <button class="btn btn-secondary ms-2" type="button" (click)="showForm = false">Cancelar</button>
    </form>
  </div>
</div>
